services:
  web:
    build: .
    command: bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on: [db, redis]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: secure_exam
      POSTGRES_USER: secure_exam
      POSTGRES_PASSWORD: secure_exam
      REDIS_HOST: redis

  celery:
    build: .
    command: celery -A secure_exam_platform worker -l info
    volumes: [".:/app"]
    depends_on: [web, redis]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: secure_exam
      POSTGRES_USER: secure_exam
      POSTGRES_PASSWORD: secure_exam
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]
